name: Instagram AI export checks

on:
  pull_request:
  push:
    branches:
      - feature/instagram-ai-ready-export

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q common/src instagram/src windows/app.py
      - name: Run Instagram unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/common/src:${{ github.workspace }}/instagram/src
        run: python -m pytest -q instagram/tests
