[paths]
output_dir = "twitter_downloads"
profile_dir = ".twitter_playwright_profile"
urls_output = "scraped_twitter_urls.txt"
resolved_urls_output = "resolved_twitter_urls.txt"

[scrape]
start_url = "https://x.com/home"
scrolls = 80
scroll_delay_ms = 1200
scroll_pixels = 1800
browser_width = 1280
browser_height = 900
max_idle_scrolls = 5

[download]
retries = 3
comments_limit = 200
format_selector = ""
audio_only = false
write_thumbnail = false
metadata_only = false
include_threads = false
cookie_browser_choices = [
    "brave",
    "chrome",
    "chromium",
    "edge",
    "firefox",
    "opera",
    "safari",
    "vivaldi",
]
